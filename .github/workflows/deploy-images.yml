---
name: Deploy Container Images

'on':
  push:
    branches:
      - main
    paths:
      - 'images/**'
      - '.trivyignore'
      - 'trivy.yaml'
      - 'scripts/smoke-test.sh'
  pull_request:
    branches:
      - main
    paths:
      - 'images/**'
      - '.trivyignore'
      - 'trivy.yaml'
      - 'scripts/smoke-test.sh'
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      target:
        description: Target image(s) to build ('all', 'auto', or comma-separated names)
        type: string
        default: all
      extra-tags:
        description: Comma-separated extra tags (leave blank for default v1 or release tag)
        type: string
        default: ''

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-images-${{ github.event_name == 'pull_request' && github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  deploy:
    name: Deploy
    uses: bumuellp/lights-camera-bum-action/.github/workflows/deploy-images.yml@34fd1ec3bc1c86211628dd1a8ba7cbd7da0a9594  # v1.15.1
    with:
      images: auto
      target: ${{ github.event_name == 'workflow_dispatch' && inputs.target || 'auto' }}
      shared-paths: '.trivyignore, trivy.yaml, scripts/smoke-test.sh'
      free-disk-space: true
      extra-tags: ${{ github.event_name == 'workflow_dispatch' && inputs.extra-tags || '' }}
      scan-with-trivy: true
      compliance: docker-cis-1.6.0
      push: ${{ github.event_name != 'pull_request' }}
      smoke-test-script: scripts/smoke-test.sh
    secrets:
      registry-token: ${{ secrets.GITHUB_TOKEN }}
